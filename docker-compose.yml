services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flakeguard}
      POSTGRES_USER: ${POSTGRES_USER:-flakeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakeguard -d flakeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
